# AI trading agent — non-secret configuration.
# Secrets live in .env and are never mirrored here. Code should read values from
# this file rather than hardcoding them; see trading/config.py.

specs:
  workbook: KIWOOM_API.xlsx
  index: data/specs/kiwoom.json

broker:
  # Restored 2026-09-01 evening as a MEASUREMENT-ONLY venue; the destination
  # is PAPER, then mainnet through the promotion gate (owner, same night).
  #
  # TO TURN ON PAPER TRADING (the whole flip, once 모의투자 keys are reissued
  # at the developer portal — the old pair fails 8001 even on the mock host,
  # verified 2026-09-01):
  #   1. put the new keys in .env as KIWOOM_TESTNET_APP_KEY / _SECRET_KEY
  #   2. set use_testnet: true and allow_orders: true below
  #   3. touch data/RESTART
  # Paper uses a DIFFERENT app key, so it never touches the mainnet token the
  # ai-trading-history downloader owns. Until both flags are set, dry_run is
  # forced and this venue only measures. 모의투자 is KR-ONLY (paper_markets):
  # US stays measurement-only on mainnet reads even with the flip on.
  kiwoom:
    use_testnet: false         # mainnet keys are the only working credential (READS ONLY)
    timezone: Asia/Seoul
    timeout_s: 10.0
    min_call_interval_s: 0.25  # Kiwoom 429s when quoted back-to-back
    max_retries_429: 3
    # Non-zero return codes that mean "query matched nothing", not "call
    # failed" (ust21050 -> 20). Reads only; never orders.
    empty_result_codes: ["20"]
    retry_backoff_s: 1.0
    token_refresh_skew_min: 5
    # ONE token per app key -- a second client silently revokes the first.
    token_cache: data/kiwoom_token.json
    max_pages: 20
    allow_orders: false        # master switch; measurement-only
    paper_markets: [KR]        # 모의투자 serves KR only; US never flips to the mock host
    order_paths:
      - /api/dostk/ordr
      - /api/us/ordr
    markets:
      KR:
        url_prefix: /api/dostk
        exchange: KRX
        state:
          positions:   {api_id: kt00018, params: {qry_tp: "1", dmst_stex_tp: "KRX"}}
          cash:        {api_id: kt00001, params: {qry_tp: "2"}}
          open_orders: {api_id: ka10075, params: {all_stk_tp: "0", trde_tp: "0", stex_tp: "0"}}
          fills:       {api_id: ka10076, params: {qry_tp: "0", sell_tp: "0", stex_tp: "0"}}
          evaluation:  {api_id: kt00004, params: {qry_tp: "0", dmst_stex_tp: "KRX"}}
        orders: {buy: kt10000, sell: kt10001, modify: kt10002, cancel: kt10003}
      US:
        url_prefix: /api/us
        exchange: KRX
        state:
          positions:   {api_id: ust21070}
          cash:        {api_id: ust21160}
          open_orders: {api_id: ust21050}
          fills:       {api_id: ust21510}
          evaluation:  {api_id: ust21121}
        orders: {buy: ust20000, sell: ust20001, modify: ust20002, cancel: ust20003}

  binance:
    # Spot TESTNET since 2026-08-30 (revival: learn on fake money, real data).
    # use_testnet routes only SIGNED traffic (account, orders) to the testnet
    # host; unsigned market data always reads from mainnet, because the
    # testnet's bot-seeded books would feed the flow screen noise. Testnet
    # balances reset periodically -- a discontinuous equity jump is a reset,
    # not P&L. Two books share one connection and ONE USDT balance, so a
    # crypto entry and a bStocks entry compete for the same cash -- sizing must
    # never assume a book owns the balance.
    use_testnet: true
    timezone: Asia/Seoul         # operator-local time for cycle stamps and reports
    timeout_s: 15.0
    recv_window_ms: 5000
    min_call_interval_s: 0.1     # well inside the 1200 weight/min budget
    retry_backoff_s: 2.0
    # Orders authorized on TESTNET at owner instruction 2026-08-30 ("by testnet,
    # you can trade in my account"). They transmit to testnet.binance.vision.
    allow_orders: true

    # Logical name -> REST call, so an endpoint change is a config edit.
    endpoints:
      exchange_info: {path: /api/v3/exchangeInfo}
      ticker_24hr:   {path: /api/v3/ticker/24hr}
      price:         {path: /api/v3/ticker/price}
      klines:        {path: /api/v3/klines}
      account:       {path: /api/v3/account,    signed: true}
      open_orders:   {path: /api/v3/openOrders, signed: true}
      my_trades:     {path: /api/v3/myTrades,   signed: true}
      order:         {path: /api/v3/order, method: POST,   signed: true, order: true}
      cancel:        {path: /api/v3/order, method: DELETE, signed: true, order: true}

    markets:
      CRYPTO:
        quote_asset: USDT
        # Everything USDT-quoted that is NOT a tokenized equity.
        exclude_permission_tag: TRD_GRP_261
      BSTOCKS:
        quote_asset: USDT
        # 66 tokenized US equities. Identified by permission tag, never by a
        # symbol suffix: NVDAB/CRCLB/TSLAB end in B, but so do BNB, SHIB and ARB.
        permission_tag: TRD_GRP_261

state:
  # Broker records are authoritative. Anything persisted locally is a derived
  # cache for analytics and audit, never a substitute for a broker read.
  source_of_truth: broker
  max_staleness_s: 5      # re-read from the broker if cached state is older
  reconcile_before_order: true

llm:
  # DeepSeek and Qwen called directly; both speak the OpenAI-compatible protocol.
  # Only API keys come from .env; endpoints are configuration.
  providers:
    deepseek:
      base_url: https://api.deepseek.com
    qwen:
      # DashScope is region-partitioned and a key is valid on exactly one host.
      # This account's key is mainland (Beijing); the intl host returns 401 for it.
      # International keys use https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

  # Price per 1,000,000 tokens in the entry's `currency`, PEAK cache-miss
  # rates, verified 2026-08-30. THIS ACCOUNT IS BILLED IN CNY, and DeepSeek's
  # CNY list (api-docs.deepseek.com/zh-cn/quick_start/pricing) uses a fixed
  # ~6.82 internal ratio to the USD list -- NOT the market rate -- so the
  # DeepSeek models are priced from the CNY list and converted at usd_cny.
  # Deliberately worst-case: off-peak (all hours outside Mon-Fri 09:00-12:00 and
  # 14:00-18:00 Beijing time) is 50% off and cache hits bill ~3% of the miss
  # rate, so real spend runs BELOW what the ledger reports.
  pricing:
    deepseek-v4-flash: {input: 3.00, output: 9.00,  currency: CNY}
    deepseek-v4-pro:   {input: 9.00, output: 27.00, currency: CNY}
    # Legacy aliases -- gone from the docs since the V4 lineup but still
    # answering (verified 2026-08-30). Kept so a tier rollback bills nonzero
    # rather than silently free.
    deepseek-chat:     {input: 2.00, output: 8.00,  currency: CNY}
    deepseek-reasoner: {input: 4.00, output: 16.00, currency: CNY}
    qwen3-max:         {input: 1.20, output: 6.00}
    qwen-plus:         {input: 0.40, output: 1.20}
  usd_krw: 1380        # for expressing API spend against KRW trading P&L
  # Market USD/CNY. KRW for a CNY-priced call = CNY / usd_cny * usd_krw
  # (~193 KRW per CNY at these rates). Verify alongside usd_krw when either moves.
  usd_cny: 7.15

  default_tier: fast
  # deepseek-reasoner can burn its entire budget on reasoning and return EMPTY
  # content (29,751 reasoning chars against an 8,192 cap, observed 2026-08-10).
  # 36% of decisions came back blank and were journalled as considered no-trades.
  # Fall back to a non-reasoning model rather than let silence look like a choice.
  fallback_tier: fast
  # V4 model ids since 2026-08-30: the docs stopped listing deepseek-chat /
  # deepseek-reasoner, and an undocumented alias bills at an undocumented rate.
  # Both V4 models support reasoning, so max_tokens stays generous everywhere --
  # reasoning tokens count against it, and 8192 once ate an entire answer.
  tiers:
    fast:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.0
      # 32k, not 8k: v4-flash REASONS by default and burned 26,899 chars of
      # reasoning into an 8,192 cap -- empty content, finish=length, no decision
      # (observed 2026-08-31, the same trap the old reasoner tier fell into).
      max_tokens: 32768
    deep:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.0
      max_tokens: 32768
    escalation:
      # DeepSeek-only since 2026-08-30 (owner constraint). Escalation means
      # "think harder on the same provider", currently identical to deep.
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.0
      max_tokens: 32768
  # A reasoning model with a 32k budget generates for a long time before emitting
  # anything. 60s cut it off mid-answer and surfaced as APITimeoutError -- the
  # truncation fix traded one silent failure for a noisy one.
  timeout_s: 240.0
  max_retries: 2

accounting:
  # A trade is only profitable after BOTH trading costs and the API spend that
  # produced the decision. The ledger records every LLM call and every fill so the
  # break-even point is measured, not assumed.
  ledger: data/ledger.jsonl
  # Hard daily ceiling on API spend. Measured cost is ~47 KRW per decision cycle
  # (deepseek-reasoner + a qwen3-max escalation, ~27k tokens). Against 4.8M equity
  # a 60s loop would cost ~36,000 KRW/day = 15.7%/month before any trade — so the
  # budget is enforced, not advisory: the agent stops deciding when it is spent.
  max_api_krw_per_day: 2000
  # Default when a ledger row's market has no entry below. Matches the worse
  # Binance book so an unknown market can never understate its hurdle.
  fees:
    commission_rate: 0.001     # 0.1% per side (spot maker AND taker)
    sell_tax_rate: 0.0
    slippage_bps: 20
  # Per book. Binance spot: 0.1% maker AND taker per side (confirmed from the
  # live account's commissionRates), no transaction tax. Crypto spreads are
  # wider than large caps, so slippage is assumed higher. The agent spans both
  # books, so the hurdle it quotes to the model is the WORSE of them (BINANCE):
  # quoting the cheaper one would understate the bar a bStocks pick must clear.
  market_fees:
    BINANCE: {commission_rate: 0.001,   sell_tax_rate: 0.0,    slippage_bps: 20}
    CRYPTO:  {commission_rate: 0.001,   sell_tax_rate: 0.0,    slippage_bps: 15}
    BSTOCKS: {commission_rate: 0.001,   sell_tax_rate: 0.0,    slippage_bps: 20}
    # Kiwoom books, in KRW terms (currency drives the ledger's conversion).
    # KR pays the 0.15% 거래세 on sells; verify the rate each budget year.
    KR:      {commission_rate: 0.00015, sell_tax_rate: 0.0015, slippage_bps: 5, currency: KRW}
    US:      {commission_rate: 0.00015, sell_tax_rate: 0.0,    slippage_bps: 5, currency: USD}
  report_currency: KRW

notify:
  telegram:
    enabled: true
    # One bot per subsystem; this agent owns TRADING_AGENT_BOT_TOKEN.
    # Allowed chat ids come from TELEGRAM_ALLOWED_IDS in .env -- inbound messages
    # from anyone else are dropped, never answered.
    api_base: https://api.telegram.org
    parse_mode: Markdown
    timeout_s: 15.0
    poll_timeout_s: 30      # long-poll seconds for getUpdates
    max_message_chars: 4096 # Telegram's hard limit; longer text is split
    # Only this broker's service polls for commands. Telegram permits a single
    # getUpdates consumer per token; two services polling produced 409 Conflict
    # and non-deterministic command delivery (observed 2026-08-10). All services
    # still SEND alerts -- only receiving is exclusive.
    # binance since 2026-08-30; the only broker since 2026-09-01.
    command_owner: binance

risk:
  # ---------------------------------------------------------------------------
  # RISK APPETITE: removed at owner instruction, 2026-08-10.
  # 0 means "no limit" for every knob below. The consequence is explicit: a single
  # trade may commit the entire balance, one stop-out costs `exits.stop_loss_pct`
  # of the WHOLE account, and nothing arrests a losing streak. Restore by setting
  # any knob back to a positive number -- no code change needed.
  # ---------------------------------------------------------------------------
  max_order_value_krw: 0         # no per-order cap
  max_position_pct: 0            # no concentration cap
  max_daily_loss_krw: 0          # superseded by the unit-free percentage below
  # RESTORED 2026-08-10. With full-balance sizing and an 8% stop, one bad trade
  # costs 8% of the venue. Nothing arrested a losing streak; this does, and being
  # a fraction of equity it works in KRW and USDT alike.
  max_daily_loss_pct: 0.10
  max_orders_per_cycle: 0        # unlimited
  max_orders_per_day: 0          # unlimited

  # `enabled` does NOT control appetite -- it controls the CORRECTNESS floor, and
  # turning it off refuses to trade rather than trading unchecked. What remains
  # when every limit above is 0 constrains no bet by one won; it only rejects
  # malformed orders: positive quantity, a priceable order, a symbol that was
  # actually offered, freshly reconciled broker state, and never selling more than
  # is held. These catch defects, not market moves.
  enabled: true
  kill_switch_file: data/HALT    # presence of this file blocks new entries

sizing:
  # EXPLORATION PHASE (owner instruction 2026-08-30): small fixed fractions,
  # several concurrent positions. Five 4% positions produce five resolved
  # trades in the time one all-in produces one -- on testnet, sample count is
  # the scarce resource, not capital. Small orders also lower the liquidity
  # bar (min_volume_multiple_of_order scales with the order), which widens the
  # tradable universe the random arm samples from. Was full_balance/1.0.
  mode: fixed_fraction           # full_balance | fixed_fraction
  # MEASUREMENT REGIME (2026-09-01, owner instruction: end the fill sprint,
  # start the mainnet-verdict clock). Small fixed fractions, many slots:
  # sample count is the scarce resource, and every trade must stay at a
  # mainnet-transferable size relative to liquidity.
  fraction: 0.04                 # of orderable cash (fixed_fraction mode)
  # Orderable cash is what can actually be spent TODAY, never the marked equity.
  cash_field: ord_alow_amt
  cash_fallback_field: entr
  # Held back from every order. A market order that prices up between sizing and
  # fill is rejected outright if the balance is committed to the last won.
  reserve_pct: 0.005
  # 15, not the pre-sprint 6: closed-trip accumulation scales with slots, and
  # the 100-trip promotion criterion arrives in ~3 weeks at 15 slots vs ~6 at
  # six. Entries pause while the sprint's surplus positions unwind below this.
  max_positions: 15
  lot_size: 1                    # Binance quantises per symbol; this is a floor only

explore:
  # The random exploration arm. Fills the experience corpus with ground truth
  # the model arm cannot: random entries sample the TRADABLE universe
  # (liquidity, lot rules and the stablecoin exclusion still apply; the
  # screen's momentum/flow bounds deliberately do NOT, or the screen's own
  # thresholds could never be falsified). Costs no model tokens. Decay
  # entry_pct toward floor_pct by hand as the corpus fills -- never to zero,
  # or model-vs-chance stops being measurable.
  enabled: true
  entry_pct: 0.5                 # measurement regime; decay toward floor_pct as the corpus fills
  floor_pct: 0.15                # documented decay floor (manual)
  max_positions: 12              # concurrently open random-arm entries (within sizing's 15)
  entries_per_cycle: 1
  seed: 20260830                 # reproducible sequence; 0 = OS entropy

score:
  # The offline scorer -- the RAG build step. Joins journaled decisions and
  # universe snapshots to forward mainnet returns, aggregates into
  # sample-gated buckets, and writes the experience store the decide prompt
  # reads. Runs inside the service between cycles; also runnable standalone:
  #   uv run python -m trading.agent.scorer
  enabled: true
  horizon_minutes: 4320          # forward-return horizon = max_hold
  interval_minutes: 60
  min_bucket_n: 10               # below this a bucket never reaches the prompt
  max_opens_per_run: 150         # spreads the first universe sweep's kline calls
  observations: data/observations.jsonl
  experience: data/experience.json
  # Closed-trade outcomes only count from the testnet epoch onward -- the
  # ledger also holds the live mainnet era, and mixing epochs is exactly the
  # kind of false signal the scorer exists to prevent.
  trade_since: "2026-08-30"
  trade_markets: [CRYPTO, BSTOCKS, BINANCE]

promotion:
  # THE POINT OF THE REPOSITORY: promote to mainnet when measured profit is
  # positive, stay on testnet and keep learning otherwise. The gate renders in
  # /status and `python -m trading.agent.promotion`; it measures, the OWNER
  # flips use_testnet (after preflight and a ~$6 wire_test --live).
  min_closed_trades: 100         # sample floor for the net-P&L verdict
  min_shadow_pairs: 30           # model must beat random with a real n
  # Measurement epoch start; empty = score.trade_since. Bump past regime
  # changes (a sprint, a testnet reset) so the verdict measures the
  # configuration that would actually trade on mainnet.
  # 2026-09-02: the fill sprint ended the evening of 09-01; the verdict clock
  # starts the next UTC day, skipping the transitional evening.
  since: "2026-09-02"

rungs:
  # Ladder in and out instead of committing everything at one price. Fees are
  # proportional to notional, so N rungs cost the same in commission as one order;
  # what binds is that each rung must clear the venue's minNotional on its own.
  enabled: true
  entry:
    count: 4
    start_offset_pct: 0.0     # first rung at the reference price
    spacing_pct: 0.005        # each subsequent rung 0.5% lower
    # Front-loaded: take a real position immediately, improve the average only if
    # the market comes to us. Flat weights would leave most of the capital
    # depending on a fall that may never happen.
    weights: [0.4, 0.3, 0.2, 0.1]
  exit:
    count: 3
    # Multiples of the ROUND-TRIP HURDLE above NET BREAK-EVEN, not above entry:
    # scaling out from the entry price sells the first rung at a loss after costs.
    first_hurdle_multiple: 2.0
    spacing_hurdle_multiple: 2.0
    weights: [0.3, 0.3, 0.4]

service:
  # Restart-by-exit. NSSM restarts the process whenever it exits (AppRestartDelay
  # + three SCM recovery attempts), so the process can restart ITSELF simply by
  # returning -- no service-control rights, no elevation, no UAC prompt. That
  # matters because config is read at start-up: changing config.yaml has no effect
  # until a restart, and needing a human at an admin console for that makes the
  # bot unmaintainable while it is holding a position.
  #
  # Touch this file to request one. The service deletes it and exits cleanly.
  restart_file: data/RESTART
  # An intentional restart and a real crash look IDENTICAL to Windows SCM -- both
  # log "terminated unexpectedly". This line is what tells them apart afterwards:
  # a boot NOT preceded by it is a crash worth investigating.
  graceful_exit_log: "graceful restart requested"

exits:
  # Exits are derived from the COST HURDLE, not from arbitrary R multiples.
  # A round trip costs ~0.28% of notional, so a position's real break-even is its
  # entry price marked up by that, plus its share of the API spend that opened it.
  # Every level below is expressed as a multiple of that hurdle, which means the
  # levels re-derive themselves whenever fees or model prices change.
  enabled: true
  # The supervisor runs on its own clock, independent of the decision loop and of
  # the API budget: when the model stops, exits must not.
  check_interval_s: 30
  # Widened 2026-08-10 to match measured volatility. A 3% stop on names whose
  # hourly swings exceed 3% is stopped out by noise before the thesis resolves --
  # which is why every cycle declined: the trader was asked for +7.8% in 6h and
  # correctly judged it unreachable.
  stop_loss_pct: 0.08
  target_hurdle_multiple: 4.0   # take profit at net breakeven + 4x the round trip
  # ...but never at a worse reward:risk than this, measured from NET breakeven.
  # Without it a 3% stop against a 1.1% target needs a ~75% hit rate to break even.
  min_reward_risk: 2.0
  trail_arm_hurdle_multiple: 2.0  # start trailing once this far past net breakeven
  trail_give_back: 0.4          # surrender this fraction of the run when trailing
  # A position that has not cleared its hurdle in this long is paying costs to do
  # nothing. Time is a cost too.
  # 72h, not 6h. BMTUSDT ran 104% low-to-high over a DAY; in any 6-hour slice most
  # of that is chop. The backtest's only configurations that beat buy-and-hold used
  # multi-day holds. The window must fit the move, not the other way round.
  max_hold_minutes: 4320
  # Policy state (stop levels) is OURS and is persisted; quantities and prices are
  # always the broker's. Reconciled against broker holdings on every pass.
  state: data/exit_policy.json
  # A halt stops NEW risk. It must never prevent reducing existing risk, or the
  # kill switch becomes a trap that locks you into a losing position.
  exits_allowed_under_halt: true

  # Per venue: volatility does not transfer, so levels are set where they apply.
  markets:
    KR:
      stop_loss_pct: 0.04
      min_reward_risk: 2.0
      max_hold_minutes: 2880      # 2 trading days
    US:
      stop_loss_pct: 0.025        # US large caps; 8% is several days of range
      min_reward_risk: 1.8
      max_hold_minutes: 2880
    BINANCE:
      # Measurement regime (2026-09-01): the window must fit the move. The
      # backtest's +15.5% band average and the 2026-08-10 research both live
      # at multi-day horizons; 180-minute sprint holds guaranteed the hurdle
      # bled every trip.
      stop_loss_pct: 0.08
      min_reward_risk: 2.0
      max_hold_minutes: 4320

agent:
  enabled: true
  market: BINANCE
  # Set true to stop trading while keeping the observe/decide/journal pipeline
  # running.
  dry_run: false
  loop_interval_s: 900
  # Skip the model entirely when the screen output has not materially changed --
  # re-deciding on an identical candidate set buys nothing and costs tokens.
  skip_decide_if_unchanged: true
  journal: data/journal.jsonl     # append-only per broker; non-binance gets journal.<broker>.jsonl

  # The universe is the whole market, fetched from the broker -- never a
  # hand-maintained list. That is far too many to price or to put in a prompt,
  # so each cycle runs a deterministic funnel:
  #   full universe -> ranking screens -> top N candidates -> model
  # The model only ever sees `candidates`; the screens decide what it may consider.
  universe:
    refresh_hours: 12             # re-fetch the tradable list this often
    cache: data/universe
    KR:
      list: {api_id: ka10099}     # 종목정보 리스트, one call per market segment
      segments: {mrkt_tp: ["0", "10"]}   # 0 코스피, 10 코스닥
      # ka10099 returns ~4,293 rows; filtering to common stock with normal
      # audit status leaves the ~2,483-name tradable universe.
      include_market_names: ["거래소", "코스닥"]
      require_audit_normal: true
      exclude_states: ["거래정지", "정리매매"]
    US:
      # stex_tp is REQUIRED (%:전체); without it the call 400s and the
      # universe silently comes back empty.
      list: {api_id: usa10099, params: {stex_tp: "%"}}
      segments: {}
      market_name_field: mkgb
      exchange_field: stex_tp
      etf_field: isEtf
      exclude_etf: true
      include_market_names: ["NYSE", "NASDAQ", "AMEX"]
      require_audit_normal: false
      exclude_states: []

  screen:
    candidates: 25                # how many symbols reach the model
    min_price: 0                  # fallback only; each market sets its own below
    # Binance lists microcaps whose entire daily turnover is smaller than one
    # full-balance order; entering those moves the price against us.
    min_quote_volume: 500000      # USDT rolling 24h, absolute floor
    # Only names already moving hard qualify. 20% beat 10% in every backtest window.
    min_change_pct: 0.15
    max_change_pct: 0.60          # above this the move is spent, not startingm
    # ...and the real floor scales with the order: an entry must stay under
    # 1/200th of the thinnest allowed name's daily turnover. Changing the balance
    # therefore moves the liquidity bar automatically.
    min_volume_multiple_of_order: 200
    # Stablecoins rank top by volume and never move. Excluded by base asset.
    # BFUSD/USDE/USDS/RLUSD/FRAX added 2026-08-31 after the random arm bought
    # BFUSD -- a yield-bearing stable is still a stable, and a 3h hold in one
    # is a slot spent measuring nothing.
    exclude_assets: [USDC, USD1, FDUSD, TUSD, DAI, BUSD, USDP, EURI, AEUR, XUSD,
                     BFUSD, USDE, USDS, RLUSD, FRAX]
    # Crypto is ~100x deeper than bStocks, so ranking them together gives bStocks
    # zero slots. Each book competes only against itself.
    # Verified 2026-08-30: the testnet DOES list bStocks pairs (NVDABUSDT quoted
    # live), so both books trade there. Caveat: quantisation filters come from
    # mainnet exchangeInfo (data plane); a testnet filter mismatch surfaces as a
    # BinanceError at order time, not silently.
    book_slots:            {CRYPTO: 18, BSTOCKS: 7}
    # Recalibrated 2026-08-30 for fixed-fraction sizing: the old floors
    # (CRYPTO 5M / BSTOCKS 500k) were sized against full-balance orders. A 4%
    # position needs ~200x its own notional, which min_volume_multiple_of_order
    # already enforces dynamically; these absolute floors only exclude names
    # whose books are too thin to trust at ANY size. The change also widens the
    # universe sweep the scorer observes -- the corpus fills ~5x faster.
    book_min_quote_volume: {CRYPTO: 1000000, BSTOCKS: 100000}
    # Rank by ORDER FLOW rather than price change. Measured on 1,000 daily bars,
    # 10 majors: top decile of 5-day taker-buy share -> +1.58% over the next 5
    # days vs +0.53% bottom decile (spread +1.05%, ~2x the round trip). The same
    # data gives a -0.06% spread for 3-day price change, i.e. nothing.
    use_flow: true
    flow_interval: 1d
    flow_lookback: 5
    flow_pool_per_book: 30
    BINANCE:
      min_price: 0                # any price; quantisation handles sub-cent coins
    KR:
      min_price: 1000             # KRW
      rankers:
        - {api_id: ka10032, params: {mrkt_tp: "000", mang_stk_incls: "0", stex_tp: "1"}}  # 거래대금상위
        # 전일대비등락률상위: 상승률순, 우선주+관리주 제외, 1억원 이상 거래대금만.
        - {api_id: ka10027, params: {mrkt_tp: "000", sort_tp: "1", trde_qty_cnd: "0100", stk_cnd: "4", crd_cnd: "0", updown_incls: "0", pric_cnd: "0", trde_prica_cnd: "10", stex_tp: "1"}}
    US:
      min_price: 1                # USD
      min_change_pct: 0.02
      max_change_pct: 0.25
      # stk_tp "1" restricts to 주식; the default mixes in ETFs and indices.
      rankers:
        - {api_id: usa20540, params: {stk_tp: "1", stex_tp: "0"}}                  # 당일 거래대금 상위
        - {api_id: usa20910, params: {stk_tp: "1", stex_tp: "0", sort_tp: "1"}}    # 전일대비 등락률상위
  # BINANCE is 24/7: `always_open` markets skip the clock gate entirely rather
  # than being given fake 00:00-23:59 hours that would still close for a minute
  # each day and stop trading at a weekend boundary.
  always_open: ["BINANCE"]
  # Equities follow their exchange's own clock, declared in its own timezone so
  # DST resolves from the zone database rather than fixed KST offsets.
  sessions:
    KR: {timezone: Asia/Seoul,       open: "09:00", close: "15:20"}
    US: {timezone: America/New_York, open: "09:30", close: "15:55"}
  trade_on_weekends: false
  # Quote endpoints the observe step uses, per market surface.
  quotes:
    KR:
      basic: {api_id: ka10001}                              # 주식기본정보요청
      orderbook: {api_id: ka10004}                          # 주식호가요청
    US:
      basic: {api_id: usa20100, params: {stex_tp: "%"}}     # 미국주식 현재가 종목정보
  tiers:
    # deepseek-chat, not deepseek-reasoner: the reasoner returned EMPTY content
    # on 36% of decisions (budget burned on reasoning) and costs ~2x more, and
    # `fast` answered the same prompts cleanly (measured 2026-08-10). Low
    # confidence still escalates to the reasoner below.
    decide: fast          # tier that proposes intents
    escalate_on_low_confidence: escalation
    # Was 0.6 -- an arbitrary round number that demanded near-certainty for trades
    # profitable above a ~35% hit rate. Set just above the payoff's break-even so
    # the floor screens out genuine coin flips, not positive-expectancy bets.
    confidence_floor: 0.45
